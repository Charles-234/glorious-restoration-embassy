<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A365D" />
      <stop offset="100%" stop-color="#2B6CB0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" rx="48" />
  <circle cx="280" cy="230" r="160" fill="#FFFFFF" opacity="0.08" filter="url(#glow)" />
  <circle cx="960" cy="420" r="110" fill="#F6E05E" opacity="0.16" />
  <text x="90" y="200" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="64" font-weight="700">GLORY EMBASSY</text>
  <text x="90" y="280" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="48" font-weight="600">OF GRACE CHURCH</text>
  <text x="90" y="360" fill="#CBD5E1" font-family="Inter, sans-serif" font-size="28" letter-spacing="0.08em">Our year of great Harvest</text>
  <text x="90" y="480" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="28">Worship · Sermons · Livestream · Community</text>
</svg>
